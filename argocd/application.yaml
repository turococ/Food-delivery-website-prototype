apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: food-delivery
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/turococ/Food-delivery-website-prototype.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
