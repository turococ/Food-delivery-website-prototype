stages:
  - build
  - push
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: registry.gitlab.com/turococ/food-delivery-website-prototype

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# BUILD
build-image:
  stage: build
  
  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" delivery_service
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# PUSH
push:web:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build:web
  script:
    - docker push $REGISTRY/web:$CI_COMMIT_SHA
    - docker push $REGISTRY/web:latest
  only:
    - main

push:metrics-exporter:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build:metrics-exporter
  script:
    - docker push $REGISTRY/metrics-exporter:$CI_COMMIT_SHA
    - docker push $REGISTRY/metrics-exporter:latest
  only:
    - main

push:worker:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build:worker
  script:
    - docker push $REGISTRY/worker:$CI_COMMIT_SHA
    - docker push $REGISTRY/worker:latest
  only:
    - main

# DEPLOY
deploy:argocd:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - push:web
    - push:metrics-exporter
    - push:worker
  script:
    - kubectl config use-context $KUBE_CONTEXT
    - kubectl patch application food-delivery -n argocd --type merge -p '{"operation":{"initiatedBy":{"username":"gitlab-ci"}}}'
    - echo "ArgoCD sync triggered"
  only:
    - main
  when: manual