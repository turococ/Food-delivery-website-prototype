stages:
  - build
  - deploy

build-image:
  stage: build
  
  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" delivery_service
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: alpine:3.20
  before-script:
    - apk add --no-cache gir sed

  script:
    - sed -i "s|image: .*|image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|" k8s/deployment.yaml
    - git config user.email "ci@example.com"
    - git config user.name "gitlab-ci"
    - git commit -am "Deploy $CI_COMMIT_SHORT_SHA [skip ci]"
    - git push "https://oauth2:${CI_PUSH_TOKEN}@gitlab.com/turococ/Food-delivery-website-prototype.git" HEAD:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'