stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  GIT_DEPTH: 20

default:
  interruptible: true

# BUILD + PUSH

.docker_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

web:
  extends: .docker_build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -f delivery_service/Dockerfile delivery_service/
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/web:latest"
        docker push "$CI_REGISTRY_IMAGE/web:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

worker:
  extends: .docker_build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHA" -f delivery_service/Dockerfile.worker delivery_service/
    - docker push "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/worker:latest"
        docker push "$CI_REGISTRY_IMAGE/worker:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

metrics_exporter:
  extends: .docker_build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/metrics-exporter:$CI_COMMIT_SHA" -f delivery_service/Dockerfile.go delivery_service/
    - docker push "$CI_REGISTRY_IMAGE/metrics-exporter:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/metrics-exporter:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/metrics-exporter:latest"
        docker push "$CI_REGISTRY_IMAGE/metrics-exporter:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# GITOPS DEPLOY
#
# CI не ходит в локальный Kubernetes: он обновляет теги образов в манифестах,
# а Argo CD сам синхронизирует кластер с веткой main.
update_manifests:
  stage: deploy
  image: alpine:3.20
  needs:
    - web
    - worker
    - metrics_exporter
  before_script:
    - apk add --no-cache git sed
    - test -n "$GIT_PUSH_TOKEN" || (echo "GIT_PUSH_TOKEN пуст. Добавьте переменную в Settings -> CI/CD -> Variables, scope All (*)." && exit 1)
    - git config --global user.email "ci@food-delivery.local"
    - git config --global user.name "GitLab CI"
  script:
    - 'sed -i -E "s#(image: .*/web):[^ ]+#\1:${CI_COMMIT_SHA}#" k8s/deployment.yaml'
    - 'sed -i -E "s#(image: .*/worker):[^ ]+#\1:${CI_COMMIT_SHA}#" k8s/worker.yaml'
    - 'sed -i -E "s#(image: .*/metrics-exporter):[^ ]+#\1:${CI_COMMIT_SHA}#" k8s/metrics_exporter.yaml'
    - 'git add k8s/deployment.yaml k8s/worker.yaml k8s/metrics_exporter.yaml'
    - |
      if git diff --cached --quiet; then
        echo "Теги образов уже актуальны"
        exit 0
      fi
    - 'git commit -m "ci: deploy ${CI_COMMIT_SHORT_SHA} [skip ci]"'
    - 'git push "https://oauth2:${GIT_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
