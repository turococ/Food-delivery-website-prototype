apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: food-delivery
  template:
    metadata:
      labels:
        app: food-delivery
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: food-delivery
          image: registry.gitlab.com/turococ/food-delivery-website-prototype:88fbbc41
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: food_delivery
            - name: DB_USER
              value: food
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: food-delivery-data