apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-delivery
  template:
    metadata:
      labels:
        app: food-delivery
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: food-delivery
          image: registry.gitlab.com/turococ/food-delivery-website-prototype:a4445e28
          ports:
            - containerPort: 8080