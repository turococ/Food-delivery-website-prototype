apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery
spec:
  ingressClassName: nginx
  rules:
    - host: cafe.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-delivery
                port:
                  number: 8080
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-delivery
                port:
                  number: 8080
    # Catch-all for 127.0.0.1 and any other local Host header.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-delivery
                port:
                  number: 8080

